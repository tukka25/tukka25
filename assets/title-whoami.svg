<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Whoami">
<title>Whoami</title>
<style>
@font-face{font-family:'LabelSans';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'TermMono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'LabelSans','Poppins',Arial,sans-serif;font-weight:600;font-size:22px;letter-spacing:5px}
.m{font-family:'TermMono','JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:13px}
.flick{animation:flick 7s steps(1,end) infinite;animation-delay:-1.3s}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.3}92%{opacity:1}94%{opacity:.55}95%{opacity:1}}
.run{stroke-dasharray:46 1400;animation:run 3.2s linear infinite}
@keyframes run{from{stroke-dashoffset:46}to{stroke-dashoffset:-460}}
</style>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d97757"/>
    <stop offset="1" stop-color="#c15f3c"/>
  </linearGradient>
  <linearGradient id="ll" gradientUnits="userSpaceOnUse" x1="345.3" y1="0" x2="20" y2="0">
    <stop offset="0" stop-color="#d4a27f"/>
    <stop offset="1" stop-color="#d4a27f" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lr" gradientUnits="userSpaceOnUse" x1="554.7" y1="0" x2="880" y2="0">
    <stop offset="0" stop-color="#d4a27f"/>
    <stop offset="1" stop-color="#d4a27f" stop-opacity="0"/>
  </linearGradient>
</defs>
<line x1="345.3" y1="33" x2="20" y2="33" stroke="url(#ll)" stroke-width="2"/>
<line x1="554.7" y1="33" x2="880" y2="33" stroke="url(#lr)" stroke-width="2"/>
<line class="run" x1="345.3" y1="33" x2="20" y2="33" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
<line class="run" x1="554.7" y1="33" x2="880" y2="33" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
<rect x="341.3" y="29" width="8" height="8" transform="rotate(45 345.3 33)" fill="#d97757"/>
<rect x="550.7" y="29" width="8" height="8" transform="rotate(45 554.7 33)" fill="#6a9bcc"/>
<g class="flick">
  <text class="m" x="367.3" y="38" fill="#87867f">0x01</text>
  <text class="d" x="410.5" y="41" fill="url(#tg)">WHOAMI</text>
</g>
</svg>
