<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="Featured Builds">
<title>Featured Builds</title>
<style>
@font-face{font-family:'HeroDisplay';font-weight:900;src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'TermMono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.d{font-family:'HeroDisplay','Orbitron','Arial Black',sans-serif;font-weight:900;font-size:24px;letter-spacing:6px}
.m{font-family:'TermMono','JetBrains Mono',ui-monospace,monospace;font-weight:600;font-size:13px}
.flick{animation:flick 7s steps(1,end) infinite;animation-delay:-5.2s}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.3}92%{opacity:1}94%{opacity:.55}95%{opacity:1}}
.run{stroke-dasharray:46 1400;animation:run 3.2s linear infinite}
@keyframes run{from{stroke-dashoffset:46}to{stroke-dashoffset:-460}}
</style>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2bd6"/>
    <stop offset="1" stop-color="#7b2ff7"/>
  </linearGradient>
  <linearGradient id="ll" gradientUnits="userSpaceOnUse" x1="232.7" y1="0" x2="20" y2="0">
    <stop offset="0" stop-color="#ff2bd6"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="lr" gradientUnits="userSpaceOnUse" x1="667.3" y1="0" x2="880" y2="0">
    <stop offset="0" stop-color="#7b2ff7"/>
    <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<line x1="232.7" y1="33" x2="20" y2="33" stroke="url(#ll)" stroke-width="2"/>
<line x1="667.3" y1="33" x2="880" y2="33" stroke="url(#lr)" stroke-width="2"/>
<line class="run" x1="232.7" y1="33" x2="20" y2="33" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
<line class="run" x1="667.3" y1="33" x2="880" y2="33" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
<rect x="228.7" y="29" width="8" height="8" transform="rotate(45 232.7 33)" fill="#ff2bd6"/>
<rect x="663.3" y="29" width="8" height="8" transform="rotate(45 667.3 33)" fill="#7b2ff7"/>
<g class="flick" filter="url(#glow)">
  <text class="m" x="254.7" y="38" fill="#7b2ff7">0x04</text>
  <text class="d" x="297.9" y="42" fill="url(#tg)">FEATURED BUILDS</text>
</g>
</svg>
